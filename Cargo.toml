[package]
name = "material_theme"
version = "0.1.0"
edition = "2024"

[dependencies]
iced = { version = "0.15.0-dev" }
material-colors = { version = "0.4", default-features = false, features = ["std"] }

# `iced` is asked for by version above and pointed at a source here, so nothing
# about where it comes from is baked into the dependency itself. A consumer can
# aim this at another branch, a fork, or a local checkout without this crate
# knowing, and every crate in the graph asking for `iced 0.15.0-dev` follows —
# which is what keeps `Color` and `Element` one type across all of them. Pinning
# the same `rev` in every crate was the old way of getting that, and it meant
# the whole graph had to move in lockstep.
#
# 0.15 is unreleased, so this block is not optional: cargo cannot resolve
# `iced 0.15.0-dev` from crates.io without it. And cargo only honours `[patch]`
# in the manifest of the workspace being built, so a crate that depends on this
# one needs its own copy.
[patch.crates-io]
iced = { git = "https://github.com/iced-rs/iced.git", branch = "master" }

[features]
default = []
# Mirror iced's optional widgets. Enabling one here turns on the matching iced
# feature and compiles this crate's style module for it.
svg = ["iced/svg"]
qr_code = ["iced/qr_code"]
markdown = ["iced/markdown"]
all-widgets = ["svg", "qr_code", "markdown"]

[dev-dependencies]
# Demo-only. Kept out of [dependencies] so consumers of this crate don't inherit
# the `../widgets` path dep, which won't exist outside this workspace.
widgets = { path = "../widgets", features = ["color_picker_two", "m3_theme"] }

[lib]
path = "src/lib.rs"

[[example]]
name = "demo"
path = "examples/demo.rs"
